[package]
name = "mic-filter"
description = "System-wide mic processing: gain, EQ, compression and noise removal on a virtual mic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5.61", features = ["derive"] }
mic-filter-dsp = { path = "../dsp" }
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.0.7"
toml_edit = "0.25.5"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10.1", features = ["v1_0_0"] }
